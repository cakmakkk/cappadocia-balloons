name: Fetch status and deploy

on:
  schedule:
    # Morning decisions: every 10 minutes, 03:03–10:53 Türkiye time (UTC+3).
    # Odd minutes, because GitHub delays runs most at the top of the hour.
    - cron: '3-59/10 0-7 * * *'
    # Rest of the day: hourly.
    - cron: '7 8-23 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch
      - name: Commit new states and forecast records
        run: |
          git add data/history data/forecasts
          if git diff --cached --quiet; then
            echo "No new state"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: balloon status $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - run: npm run check
      - id: pages
        uses: actions/configure-pages@v6
      # Build on every run so the "last checked" time on the site stays fresh.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Search engine verification tags: set these as repository variables.
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          PUBLIC_NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
      - name: Check the built pages
        run: npm run check:dist
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Pushes change pages and guides; status updates only change today's
  # numbers, so search engines are only pinged after a push.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
