name: Fetch status and deploy

on:
  schedule:
    # Morning decisions: every 15 minutes, 04:00–11:45 Türkiye time (UTC+3).
    - cron: '*/15 1-8 * * *'
    # Rest of the day: hourly.
    - cron: '0 0,9-23 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch
      - name: Commit new states
        run: |
          git add data/history
          if git diff --cached --quiet; then
            echo "No new state"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: balloon status $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - id: pages
        uses: actions/configure-pages@v6
      # Build on every run so the "last checked" time on the site stays fresh.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
